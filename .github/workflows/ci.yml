name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint and format on node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20.18.2', '22.13.1']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check

  test:
    name: test on node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20.18.2', '22.13.1']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test

  coverage:
    name: coverage thresholds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.18.2'
          cache: npm
      - run: npm ci
      - run: npm run coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  audit:
    name: dependency advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.18.2'
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high

  release:
    name: release check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.18.2'
          cache: npm
      - run: npm ci
      - run: npm run release:check

  smoke:
    name: command line smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.18.2'
          cache: npm
      - run: npm ci
      - run: npm run smoke
      - name: the examples the readme shows still run
        run: |
          node bin/shadelot.js card -w examples/works.json -r examples/recipe-olive.json -l 200
          node bin/shadelot.js plan -w examples/works.json -r examples/recipe-olive.json -g examples/lots.json -m JET-4
          node bin/shadelot.js run-sheet -p examples/profile-reactive-60.json
          node bin/shadelot.js stock -s examples/stock.json --reorder examples/reorder-points.json
          node bin/shadelot.js works -w examples/works.json
          node bin/shadelot.js sequence -d examples/day-sequence.json
          node bin/shadelot.js analyse -m examples/month-batches.json --hours 480
          node bin/shadelot.js loadout -w examples/works.json -g examples/lots.json
          node bin/shadelot.js despatch -r examples/finished-rolls.json -o O25-0900
          node bin/shadelot.js library -s examples/standard-olive.json --dips examples/dip-library.json
          node bin/shadelot.js reuse -w examples/works.json --previous examples/recipe-olive.json --next examples/recipe-olive-deep.json
          node bin/shadelot.js standards -s examples/standards.json --today 2025-05-01 --limit 20
          node bin/shadelot.js commands

      - name: every command is described in the listing
        run: |
          node bin/shadelot.js commands --format json > /tmp/commands.json
          node -e "
            const rows = require('/tmp/commands.json');
            const thin = rows.filter((row) => !row.description || row.description.length < 12);
            if (thin.length) {
              console.error('undescribed: ' + thin.map((r) => r.command).join(', '));
              process.exit(1);
            }
            console.log(rows.length + ' commands, all described');
          "
